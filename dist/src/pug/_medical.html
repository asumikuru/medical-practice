<section class="p-medical" id="medical"><div class="l-container"><div class="p-medical__inner"><h2 class="c-heading-primary">診療案内<span class="en">Medical</span></h2><p class="p-medical__lead">当院では、身体の痛みや違和感に関する幅広い診療を行っております。</p><ul class="p-medical__list"><li class="p-medical__item"><h3 class="p-medical__item-title">整形外科</h3><p class="p-medical__item-text">肩こり、腰痛、膝の痛み、骨折、打撲、捻挫などの一般整形外科診療。</p></li><li class="p-medical__item"><h3 class="p-medical__item-title">リハビリテーション科</h3><p class="p-medical__item-text">理学療法士による個別の運動療法・物理療法（温熱・牽引など）。</p></li><li class="p-medical__item"><h3 class="p-medical__item-title">スポーツ整形外科</h3><p class="p-medical__item-text">スポーツによるケガ（肉離れ・靭帯損傷など）の治療と予防指導。</p></li><li class="p-medical__item"><h3 class="p-medical__item-title">骨粗しょう症外来</h3><p class="p-medical__item-text">骨密度測定装置を用いた早期発見と予防・薬物療法。</p></li></ul></div></div></section>
